<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Design portfolio" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#work">Skip to work</a>

    <header class="site-header">
      <div class="site-header__bar">
        <button
          type="button"
          class="icon-btn"
          aria-controls="site-nav"
          aria-expanded="false"
          id="nav-open"
        >
          <span class="visually-hidden">Open menu</span>
          <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true">
            <path fill="currentColor" d="M0 0h18v1.5H0V0zm0 5.25h18v1.5H0v-1.5zm0 5.25h18V12H0v-1.5z" />
          </svg>
        </button>
        <a class="site-logo" href="#" id="site-logo">Portfolio</a>
        <a class="icon-btn" href="#contact" aria-label="Contact" id="contact-bag">
          <svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              d="M1.5 6.5h15v11a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-11zM5.5 6.5V4.2a3.5 3.5 0 0 1 7 0v2.3"
            />
          </svg>
        </a>
      </div>
    </header>

    <div
      class="nav-overlay"
      id="site-nav"
      hidden
      aria-hidden="true"
    >
      <div class="nav-overlay__panel">
        <div class="nav-overlay__head">
          <span class="nav-overlay__title">Menu</span>
          <button type="button" class="icon-btn" id="nav-close" aria-label="Close menu">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
              <path fill="currentColor" d="M1.4 0 14 12.6 12.6 14 0 1.4 1.4 0zm12.6 0L14 1.4 1.4 14 0 12.6 12.6 0 14z" />
            </svg>
          </button>
        </div>
        <nav class="nav-overlay__links" aria-label="Primary">
          <a href="#work">Work</a>
          <a href="#about">About</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </div>

    <main>
      <section class="intro" id="about" aria-labelledby="about-heading">
        <h1 id="about-heading" class="visually-hidden">About</h1>
        <div class="bio" id="bio-root"></div>
      </section>

      <section class="work" id="work" aria-label="Selected work">
        <div class="portfolio" id="portfolio-root"></div>
      </section>

      <section class="files" id="files-section" aria-labelledby="files-heading">
        <div id="files-root"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> <span id="footer-name">Portfolio</span>. All rights reserved.</p>
    </footer>

    <script src="content.js"></script>
    <script src="main.js" defer></script>
  </body>
</html>
